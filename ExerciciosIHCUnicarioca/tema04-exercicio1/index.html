<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Página Simples</title>

  <!-- Nosso CSS (Etapa 5) -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <h1>Olá!</h1>
  <p id="mensagem">Aqui vai um texto que será alterado.</p>
  <button id="botao-alterar">Alterar texto</button>

  <!-- Etapa 4: conteúdo escondido -->
  <p id="mensagem-secreta" style="display: none;">
    Eu sou um texto secreto!
  </p>
  <button id="mostrar">Mostrar</button>
  <button id="esconder">Esconder</button>

  <!-- Etapa 2: jQuery via CDN (1º) -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- Etapas 3 e 4: nosso código (2º, depois do jQuery) -->
  <script src="js/script.js"></script>
</body>
</html>
